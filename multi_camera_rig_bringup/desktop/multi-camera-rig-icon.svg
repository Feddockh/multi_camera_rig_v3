<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e2a4a"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#8fe3ff"/>
      <stop offset="0.55" stop-color="#2596d1"/>
      <stop offset="1" stop-color="#0a3d5c"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CFFB2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7CFFB2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="none" stroke="#3a4a72" stroke-width="2"/>

  <!-- rig bar connecting the stereo cameras -->
  <rect x="30" y="60" width="68" height="8" rx="4" fill="#3a4a72"/>

  <!-- point-cloud sparkles rising from the scene -->
  <g fill="#7CFFB2">
    <circle cx="50" cy="40" r="2.2"/>
    <circle cx="64" cy="30" r="2.6"/>
    <circle cx="78" cy="40" r="2.2"/>
    <circle cx="58" cy="50" r="1.8"/>
    <circle cx="70" cy="50" r="1.8"/>
    <circle cx="64" cy="20" r="1.6"/>
  </g>
  <path d="M64 64 L64 24" stroke="url(#beam)" stroke-width="10" stroke-linecap="round"/>

  <!-- left camera -->
  <g>
    <rect x="16" y="56" width="26" height="26" rx="8" fill="#141c33" stroke="#3a4a72" stroke-width="2"/>
    <circle cx="29" cy="69" r="8" fill="url(#lens)"/>
    <circle cx="26.5" cy="66.5" r="2" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- right camera -->
  <g>
    <rect x="86" y="56" width="26" height="26" rx="8" fill="#141c33" stroke="#3a4a72" stroke-width="2"/>
    <circle cx="99" cy="69" r="8" fill="url(#lens)"/>
    <circle cx="96.5" cy="66.5" r="2" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- ground/base -->
  <rect x="46" y="96" width="36" height="6" rx="3" fill="#3a4a72"/>
  <rect x="60" y="82" width="8" height="16" rx="3" fill="#3a4a72"/>
</svg>
